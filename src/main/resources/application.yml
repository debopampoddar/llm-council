spring:
  application:
    name: llm-council
  ai:
    # Spring AI auto-config eagerly creates provider beans. Placeholder keys let
    # the app boot for local/mock profiles; real OpenAI runs must override the
    # placeholder with a valid runtime credential.
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:unused-development-placeholder}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        completions-path: ${SPRING_AI_OPENAI_CHAT_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${COUNCIL_OPENAI_CHAIR_MODEL:gpt-4.1}
          temperature: 0.2
    anthropic:
      api-key: ${SPRING_AI_ANTHROPIC_API_KEY:unused-development-placeholder}
    ollama:
      # The local provider uses this URL for direct Ollama /api/chat calls.
      # Use http://ollama:11434 inside full Docker Compose. Use the default when
      # the Java service runs on the host next to a native Ollama process.
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${LLM_COUNCIL_LOCAL_MODEL:llama3.1:8b}
          temperature: 0.3
          # 16384 is what a rigorous local council actually needs: three members
          # at 1200-1800 output tokens produce roughly 11k tokens of drafts,
          # reviews, and debate for the chair to synthesise. At the previous
          # default of 4096 the chair could hold about 2.3k of that and the rest
          # was truncated away. Costs roughly 2 GiB of KV cache per resident
          # model on an 8B class model; lower it if memory is tight and accept
          # the truncation warnings that follow.
          num-ctx: ${SPRING_AI_OLLAMA_NUM_CTX:16384}
          num-thread: ${SPRING_AI_OLLAMA_NUM_THREAD:0}
          keep_alive: ${SPRING_AI_OLLAMA_KEEP_ALIVE:10m}
    vertex:
      ai:
        gemini:
          # Google Cloud project and region for Vertex AI Gemini.
          # Requires Application Default Credentials (ADC):
          #   gcloud auth application-default login
          # Or a service account JSON:
          #   GOOGLE_APPLICATION_CREDENTIALS=/path/to/sa.json
          project-id: ${GOOGLE_CLOUD_PROJECT:}
          location: ${GOOGLE_CLOUD_LOCATION:us-central1}
          chat:
            options:
              model: ${COUNCIL_GEMINI_MODEL:gemini-2.5-flash}
              temperature: 0.3
  # Read only when council.persistence.type=jdbc. SQLite needs no daemon, no
  # port, and nothing installed; swap the URL for jdbc:h2:file:... to use H2
  # instead. The same store code runs on either.
  datasource:
    url: ${LLM_COUNCIL_JDBC_URL:jdbc:sqlite:${user.home}/.llm-council/council.db}
server:
  port: 8080
  # Bind to loopback by default. This is the only real access control the app
  # has: there is no authentication, so any endpoint reachable on the network is
  # reachable by anyone on it. Docker deployments must override this explicitly
  # with LLM_COUNCIL_BIND_ADDRESS=0.0.0.0 and accept that consequence.
  address: ${LLM_COUNCIL_BIND_ADDRESS:127.0.0.1}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  level:
    com.debopam.llmcouncil.model.OllamaDirectModelClient: ${LLM_COUNCIL_OLLAMA_LOG_LEVEL:INFO}

council:
  # Never silently convert a real profile into mock output. The explicit mock
  # profile remains available for tests and local smoke checks.
  allowMockFallback: false

  # Prompt budgeting: every prompt carrying council evidence (drafts, reviews,
  # debate turns) is fitted to the target model's context window before the call.
  # Set contextWindowTokens per model to override; unset derives from the
  # provider — Ollama models use spring.ai.ollama.chat.options.num-ctx, cloud
  # models assume 128000. Instructions and the question are never truncated;
  # anything removed is marked in the prompt and reported as a run warning.

  # Retry configuration for transient model failures (PROVIDER_UNAVAILABLE,
  # MODEL_TIMEOUT). Per-model overrides are supported via the model entry.
  # Defaults (applied when not specified per model):
  #   retryMaxAttempts: 2      — number of retry attempts after the initial call
  #   retryBaseDelayMs: 1000   — base delay in ms; doubled on each retry with jitter

  # Provider auto-detection: cloud providers (OpenAI, Anthropic, Gemini) activate
  # automatically when their API key or GCP project ID is set to a real value.
  # No explicit "enabled" flags needed. Placeholder keys are detected and ignored.
  # To activate a provider, just set its credential:
  #   SPRING_AI_OPENAI_API_KEY=sk-...          → OpenAI active
  #   SPRING_AI_ANTHROPIC_API_KEY=sk-ant-...   → Anthropic active
  #   GOOGLE_CLOUD_PROJECT=my-project          → Gemini/Vertex AI active
  # Ollama needs no credential, but its daemon must be running and configured
  # model tags must be pulled; profile health checks verify both.

  persistence:
    # memory | jdbc. memory is the default and creates no datasource at all:
    # nothing is written to a database, and no schema is migrated, until
    # somebody asks for durability. Set LLM_COUNCIL_PERSISTENCE=jdbc and point
    # LLM_COUNCIL_JDBC_URL at a file to have sessions and chats survive a
    # restart. Artifacts are unaffected either way — they stay on the filesystem.
    type: ${LLM_COUNCIL_PERSISTENCE:memory}
    artifactBasePath: ${LLM_COUNCIL_ARTIFACT_PATH:${user.home}/.llm-council/runs}
    # Bounds on in-memory history. Every store previously grew for the life of
    # the process, so a long-running instance ended in an OutOfMemoryError
    # rather than in degraded service. Sessions and chats still running are
    # never evicted, whatever these say.
    retention:
      max-sessions: ${LLM_COUNCIL_MAX_SESSIONS:500}
      max-age-days: ${LLM_COUNCIL_MAX_AGE_DAYS:90}
      max-events-per-session: ${LLM_COUNCIL_MAX_EVENTS_PER_SESSION:2000}

  health:
    provider-timeout-seconds: ${LLM_COUNCIL_PROVIDER_HEALTH_TIMEOUT_SECONDS:5}
  model-probe:
    # The advanced configuration page can make one tiny, fixed-prompt call to
    # validate a provider model id before saving it. Cloud calls require an
    # explicit acknowledgement. A global cooldown prevents repeated clicks from
    # multiplying billable requests, and no retry wrapper is used.
    cooldown-seconds: ${LLM_COUNCIL_MODEL_PROBE_COOLDOWN_SECONDS:10}
    timeout-seconds: ${LLM_COUNCIL_MODEL_PROBE_TIMEOUT_SECONDS:20}
  runtime:
    # Demo-safe default: one active background council run at a time. Increase
    # only when the host and model runtime can handle parallel generations.
    max-concurrent-runs: ${LLM_COUNCIL_MAX_CONCURRENT_RUNS:1}
    chat-recent-turn-count: ${LLM_COUNCIL_CHAT_RECENT_TURN_COUNT:4}

  models:
    # Local Ollama models. The direct Ollama adapter uses the configured base URL
    # and applies providerModelId to each /api/chat request.
    - id: local-llama3
      provider: ollama
      providerModelId: ${LLM_COUNCIL_LOCAL_MODEL:llama3.1:8b}
      defaultOutputTokens: ${LLM_COUNCIL_LOCAL_OUTPUT_TOKENS:1200}
      temperature: 0.3
      timeoutSeconds: ${LLM_COUNCIL_LOCAL_TIMEOUT_SECONDS:240}
      role: MEMBER
      councilRole: PROPOSER         # default debate persona
      modelFamily: ${LLM_COUNCIL_LOCAL_MODEL_FAMILY:llama} # architecture family for diversity check
    - id: local-mistral
      provider: ollama
      providerModelId: ${LLM_COUNCIL_LOCAL_ALT_MODEL:mistral:7b}
      defaultOutputTokens: ${LLM_COUNCIL_LOCAL_ALT_OUTPUT_TOKENS:1200}
      temperature: 0.35
      timeoutSeconds: ${LLM_COUNCIL_LOCAL_TIMEOUT_SECONDS:240}
      role: MEMBER
      councilRole: CRITIC           # adversarial devil's advocate persona
      modelFamily: ${LLM_COUNCIL_LOCAL_ALT_MODEL_FAMILY:mistral} # different family from llama
    # Third local member, and the reason local-rigorous is a council of three
    # rather than a council of two with one member counted twice. It previously
    # seated local-llama3 and local-chair, which both resolve to llama3.1:8b:
    # one set of weights sampled twice, reviewing and scoring itself under two
    # names. A third distinct family is also what makes reviewer disagreement
    # measurable at all — self-review is excluded, so two members give one
    # review per draft and there is nothing to disagree.
    #
    # Requires: ollama pull qwen2.5:7b
    # If it is not pulled, local-rigorous still runs: minimumSuccessfulDrafts is
    # 2 and allowPartial is true, so the council degrades to two members and
    # reports that disagreement was not measurable.
    - id: local-qwen
      provider: ollama
      providerModelId: ${LLM_COUNCIL_LOCAL_THIRD_MODEL:qwen2.5:7b}
      defaultOutputTokens: ${LLM_COUNCIL_LOCAL_THIRD_OUTPUT_TOKENS:1200}
      temperature: 0.4
      timeoutSeconds: ${LLM_COUNCIL_LOCAL_TIMEOUT_SECONDS:240}
      role: MEMBER
      councilRole: PROPOSER
      modelFamily: ${LLM_COUNCIL_LOCAL_THIRD_MODEL_FAMILY:qwen}
    # Fresh Eyes validator for local councils. Deliberately a different model
    # family from local-chair: a validator sharing the chair's weights shares
    # every one of its blind spots and cannot perform an independent check.
    # This costs nothing extra — mistral:7b is already pulled for local-mistral
    # and already resident, and VALIDATE runs alone after SYNTHESIZE so the
    # validator never has to be co-resident with the members.
    - id: local-validator
      provider: ollama
      providerModelId: ${LLM_COUNCIL_LOCAL_ALT_MODEL:mistral:7b}
      defaultOutputTokens: ${LLM_COUNCIL_LOCAL_ALT_OUTPUT_TOKENS:1200}
      temperature: 0.2
      timeoutSeconds: ${LLM_COUNCIL_LOCAL_TIMEOUT_SECONDS:240}
      role: VALIDATOR
      councilRole: CRITIC
      modelFamily: ${LLM_COUNCIL_LOCAL_ALT_MODEL_FAMILY:mistral}
    - id: local-chair
      provider: ollama
      providerModelId: ${LLM_COUNCIL_LOCAL_CHAIR_MODEL:llama3.1:8b}
      defaultOutputTokens: ${LLM_COUNCIL_LOCAL_CHAIR_OUTPUT_TOKENS:1800}
      temperature: 0.2
      timeoutSeconds: ${LLM_COUNCIL_LOCAL_TIMEOUT_SECONDS:240}
      role: CHAIR
      councilRole: SYNTHESIZER      # bridge-builder persona for the chair
      modelFamily: ${LLM_COUNCIL_LOCAL_CHAIR_MODEL_FAMILY:llama}

    # Explicit test-only mocks.
    - id: mock-member
      provider: mock
      providerModelId: mock-member
      defaultOutputTokens: 800
      temperature: 0.1
      timeoutSeconds: 30
      role: MEMBER
      testOnly: true
      councilRole: PROPOSER
      modelFamily: mock
    - id: mock-chair
      provider: mock
      providerModelId: mock-chair
      defaultOutputTokens: 800
      temperature: 0.1
      timeoutSeconds: 30
      role: CHAIR
      testOnly: true
      councilRole: SYNTHESIZER
      modelFamily: mock

    # ── Gemini / Vertex AI models ──────────────────────────────────────
    # Activates automatically when GOOGLE_CLOUD_PROJECT and ADC/service-account
    # credentials are available.
    # Requires GCP authentication:
    #   gcloud auth application-default login
    # Or: GOOGLE_APPLICATION_CREDENTIALS=/path/to/service-account.json
    - id: gemini-flash
      contextWindowTokens: 1048576
      provider: gemini
      providerModelId: ${COUNCIL_GEMINI_MODEL:gemini-2.5-flash}
      defaultOutputTokens: 2000
      temperature: 0.3
      timeoutSeconds: 120
      role: MEMBER
      councilRole: PROPOSER
      modelFamily: gemini
    - id: gemini-flash-lite
      contextWindowTokens: 1048576
      provider: gemini
      providerModelId: ${COUNCIL_GEMINI_CRITIC_MODEL:gemini-2.5-flash-lite}
      defaultOutputTokens: 1600
      temperature: 0.35
      timeoutSeconds: 120
      role: MEMBER
      councilRole: CRITIC
      modelFamily: gemini
    - id: gemini-pro
      contextWindowTokens: 1048576
      provider: gemini
      providerModelId: ${COUNCIL_GEMINI_PRO_MODEL:gemini-2.5-pro}
      defaultOutputTokens: 2200
      temperature: 0.2
      timeoutSeconds: 180
      role: CHAIR
      councilRole: SYNTHESIZER
      modelFamily: gemini

    # Validator binding for the single-provider Gemini profile. Flash and Pro
    # share a family, so this is CORRELATED rather than INDEPENDENT — the best
    # achievable without leaving the provider, and still better than the chair
    # validating its own synthesis.
    - id: gemini-validator
      provider: gemini
      providerModelId: ${COUNCIL_GEMINI_MODEL:gemini-2.5-flash}
      defaultOutputTokens: 2000
      temperature: 0.2
      timeoutSeconds: 120
      role: VALIDATOR
      councilRole: CRITIC
      modelFamily: gemini

    # ── Claude models (Anthropic provider) ─────────────────────────────
    # Activates automatically from SPRING_AI_ANTHROPIC_API_KEY.
    - id: claude-sonnet
      contextWindowTokens: 1000000
      provider: anthropic
      providerModelId: ${COUNCIL_CLAUDE_MEMBER_MODEL:claude-sonnet-5}
      defaultOutputTokens: 2000
      temperature: 0.3
      timeoutSeconds: 120
      role: MEMBER
      councilRole: PROPOSER
      modelFamily: claude
    - id: claude-haiku
      contextWindowTokens: 200000
      provider: anthropic
      providerModelId: ${COUNCIL_CLAUDE_CRITIC_MODEL:claude-haiku-4-5-20251001}
      defaultOutputTokens: 1600
      temperature: 0.35
      timeoutSeconds: 120
      role: MEMBER
      councilRole: CRITIC
      modelFamily: claude
    - id: claude-opus
      contextWindowTokens: 1000000
      provider: anthropic
      providerModelId: ${COUNCIL_CLAUDE_THIRD_MODEL:claude-opus-4-8}
      defaultOutputTokens: 2200
      temperature: 0.25
      timeoutSeconds: 180
      role: MEMBER
      councilRole: PROPOSER
      modelFamily: claude
    - id: claude-chair
      contextWindowTokens: 1000000
      provider: anthropic
      providerModelId: ${COUNCIL_CLAUDE_CHAIR_MODEL:claude-opus-5}
      defaultOutputTokens: 2200
      temperature: 0.2
      timeoutSeconds: 180
      role: CHAIR
      councilRole: SYNTHESIZER
      modelFamily: claude
    - id: claude-validator
      contextWindowTokens: 1000000
      provider: anthropic
      providerModelId: ${COUNCIL_CLAUDE_VALIDATOR_MODEL:claude-sonnet-4-6}
      defaultOutputTokens: 1600
      temperature: 0.2
      timeoutSeconds: 120
      role: VALIDATOR
      councilRole: CRITIC
      modelFamily: claude

    # ── OpenAI models ──────────────────────────────────────────────────
    # Activates automatically from SPRING_AI_OPENAI_API_KEY.
    - id: openai-gpt
      contextWindowTokens: 128000
      provider: openai
      providerModelId: ${COUNCIL_OPENAI_MODEL:gpt-4o-mini}
      defaultOutputTokens: 2000
      temperature: 0.3
      timeoutSeconds: 120
      role: MEMBER
      councilRole: PROPOSER
      modelFamily: gpt
    - id: openai-critic
      contextWindowTokens: 128000
      provider: openai
      providerModelId: ${COUNCIL_OPENAI_CRITIC_MODEL:gpt-4.1-mini}
      defaultOutputTokens: 1800
      temperature: 0.35
      timeoutSeconds: 120
      role: MEMBER
      councilRole: CRITIC
      modelFamily: gpt
    - id: openai-analyst
      contextWindowTokens: 128000
      provider: openai
      providerModelId: ${COUNCIL_OPENAI_THIRD_MODEL:gpt-4.1-nano}
      defaultOutputTokens: 1600
      temperature: 0.3
      timeoutSeconds: 120
      role: MEMBER
      councilRole: PROPOSER
      modelFamily: gpt
    - id: openai-chair
      contextWindowTokens: 128000
      provider: openai
      providerModelId: ${COUNCIL_OPENAI_CHAIR_MODEL:gpt-4.1}
      defaultOutputTokens: 2200
      temperature: 0.2
      timeoutSeconds: 180
      role: CHAIR
      councilRole: SYNTHESIZER
      modelFamily: gpt
    - id: openai-validator
      contextWindowTokens: 128000
      provider: openai
      providerModelId: ${COUNCIL_OPENAI_VALIDATOR_MODEL:gpt-4o}
      defaultOutputTokens: 1800
      temperature: 0.2
      timeoutSeconds: 120
      role: VALIDATOR
      councilRole: CRITIC
      modelFamily: gpt

  profiles:
    default:
      displayName: Local balanced council
      testOnly: false
      defaultDepth: BALANCED
      depthPolicies:
        QUICK: local-quick
        BALANCED: local-balanced
        RIGOROUS: local-rigorous
    local:
      displayName: Local Ollama council
      testOnly: false
      defaultDepth: BALANCED
      depthPolicies:
        QUICK: local-quick
        BALANCED: local-balanced
        RIGOROUS: local-rigorous
    openai:
      displayName: OpenAI council
      testOnly: false
      defaultDepth: BALANCED
      depthPolicies:
        QUICK: openai-quick
        BALANCED: openai-balanced
        RIGOROUS: openai-rigorous
    claude:
      displayName: Claude council
      testOnly: false
      defaultDepth: BALANCED
      depthPolicies:
        QUICK: claude-quick
        BALANCED: claude-balanced
        RIGOROUS: claude-rigorous
    mock:
      displayName: Mock test council
      testOnly: true
      defaultDepth: QUICK
      depthPolicies:
        QUICK: mock-quick
        BALANCED: mock-balanced
        RIGOROUS: mock-rigorous
    # ── Gemini profile: uses only Gemini models ──
    gemini:
      displayName: Google Gemini council
      testOnly: false
      defaultDepth: BALANCED
      depthPolicies:
        QUICK: gemini-quick
        BALANCED: gemini-balanced
        RIGOROUS: gemini-rigorous
    # ── Multi-cloud profile: maximum diversity across providers ──
    multi-cloud:
      displayName: Multi-cloud council (Ollama + Gemini + Anthropic/OpenAI)
      testOnly: false
      defaultDepth: BALANCED
      depthPolicies:
        QUICK: multi-cloud-quick
        BALANCED: multi-cloud-balanced
        RIGOROUS: multi-cloud-rigorous

  policies:
    local-quick:
      protocolId: quick
      memberModelIds: [local-llama3]
      chairModelId: local-chair
      validatorModelId:
      minimumSuccessfulDrafts: 1
      minimumReviewsPerDraft: 0
      validationRequired: false
      allowPartial: true
    local-balanced:
      protocolId: balanced
      memberModelIds: [local-llama3, local-mistral]
      chairModelId: local-chair
      validatorModelId: local-validator
      minimumSuccessfulDrafts: 2
      minimumReviewsPerDraft: 1
      validationRequired: true
      allowPartial: true
    local-rigorous:
      protocolId: rigorous
      # Three distinct models. The chair is deliberately NOT seated here: a chair
      # that is also a member synthesises a pool containing its own draft, and
      # anonymisation cannot correct for a model recognising its own writing.
      memberModelIds: [local-llama3, local-mistral, local-qwen]
      chairModelId: local-chair
      validatorModelId: local-validator
      minimumSuccessfulDrafts: 2
      minimumReviewsPerDraft: 1
      validationRequired: true
      allowPartial: true

    openai-quick:
      protocolId: quick
      memberModelIds: [openai-gpt]
      chairModelId: openai-chair
      validatorModelId:
      minimumSuccessfulDrafts: 1
      minimumReviewsPerDraft: 0
      validationRequired: false
      allowPartial: true
    openai-balanced:
      protocolId: balanced
      memberModelIds: [openai-gpt, openai-critic]
      chairModelId: openai-chair
      validatorModelId: openai-validator
      minimumSuccessfulDrafts: 2
      minimumReviewsPerDraft: 1
      validationRequired: true
      allowPartial: true
    openai-rigorous:
      protocolId: rigorous
      memberModelIds: [openai-gpt, openai-critic, openai-analyst]
      chairModelId: openai-chair
      validatorModelId: openai-validator
      minimumSuccessfulDrafts: 2
      minimumReviewsPerDraft: 1
      validationRequired: true
      allowPartial: true

    claude-quick:
      protocolId: quick
      memberModelIds: [claude-sonnet]
      chairModelId: claude-chair
      validatorModelId:
      minimumSuccessfulDrafts: 1
      minimumReviewsPerDraft: 0
      validationRequired: false
      allowPartial: true
    claude-balanced:
      protocolId: balanced
      memberModelIds: [claude-sonnet, claude-haiku]
      chairModelId: claude-chair
      validatorModelId: claude-validator
      minimumSuccessfulDrafts: 2
      minimumReviewsPerDraft: 1
      validationRequired: true
      allowPartial: true
    claude-rigorous:
      protocolId: rigorous
      memberModelIds: [claude-sonnet, claude-haiku, claude-opus]
      chairModelId: claude-chair
      validatorModelId: claude-validator
      minimumSuccessfulDrafts: 2
      minimumReviewsPerDraft: 1
      validationRequired: true
      allowPartial: true

    mock-quick:
      protocolId: quick
      memberModelIds: [mock-member]
      chairModelId: mock-chair
      validatorModelId:
      minimumSuccessfulDrafts: 1
      minimumReviewsPerDraft: 0
      validationRequired: false
      allowPartial: true
    mock-balanced:
      # Single-model test fixture: self-validation is the point, not an oversight.
      acknowledgeSelfValidation: true
      protocolId: balanced
      memberModelIds: [mock-member, mock-chair]
      chairModelId: mock-chair
      validatorModelId: mock-chair
      minimumSuccessfulDrafts: 1
      minimumReviewsPerDraft: 1
      validationRequired: true
      allowPartial: true
    mock-rigorous:
      # Single-model test fixture: self-validation is the point, not an oversight.
      acknowledgeSelfValidation: true
      protocolId: rigorous
      memberModelIds: [mock-member, mock-chair]
      chairModelId: mock-chair
      validatorModelId: mock-chair
      minimumSuccessfulDrafts: 1
      minimumReviewsPerDraft: 1
      validationRequired: true
      allowPartial: true

    # ── Gemini policies ──────────────────────────────────────────────
    gemini-quick:
      protocolId: quick
      memberModelIds: [gemini-flash]
      chairModelId: gemini-pro
      validatorModelId:
      minimumSuccessfulDrafts: 1
      minimumReviewsPerDraft: 0
      validationRequired: false
      allowPartial: true
    gemini-balanced:
      protocolId: balanced
      memberModelIds: [gemini-flash, gemini-flash-lite]
      chairModelId: gemini-pro
      validatorModelId: gemini-validator
      minimumSuccessfulDrafts: 2
      minimumReviewsPerDraft: 1
      validationRequired: true
      allowPartial: true
    gemini-rigorous:
      protocolId: rigorous
      # Gemini exposes two stable non-chair text models in this compatibility
      # tier. Do not seat gemini-pro merely to make the roster look larger: the
      # chair must not synthesize a pool containing its own draft.
      memberModelIds: [gemini-flash, gemini-flash-lite]
      chairModelId: gemini-pro
      validatorModelId: gemini-validator
      minimumSuccessfulDrafts: 2
      minimumReviewsPerDraft: 1
      validationRequired: true
      allowPartial: true

    # ── Multi-cloud policies ─────────────────────────────────────────
    multi-cloud-quick:
      protocolId: quick
      memberModelIds: [local-llama3, gemini-flash]
      chairModelId: gemini-pro
      validatorModelId:
      minimumSuccessfulDrafts: 1
      minimumReviewsPerDraft: 0
      validationRequired: false
      allowPartial: true
    multi-cloud-balanced:
      protocolId: balanced
      memberModelIds: [local-llama3, local-mistral, gemini-flash, claude-sonnet]
      chairModelId: gemini-pro
      validatorModelId: claude-validator
      minimumSuccessfulDrafts: 2
      minimumReviewsPerDraft: 1
      validationRequired: true
      allowPartial: true
    multi-cloud-rigorous:
      protocolId: rigorous
      memberModelIds: [local-llama3, local-mistral, gemini-flash, claude-sonnet, openai-gpt]
      chairModelId: gemini-pro
      validatorModelId: claude-validator
      minimumSuccessfulDrafts: 3
      minimumReviewsPerDraft: 1
      validationRequired: true
      allowPartial: true

  protocols:
    quick:
      description: Fast low-cost council for smoke tests and low-stakes requests.
      orderedStages: [GENERATE, SYNTHESIZE]
      stageOptions: {}
    balanced:
      description: Default council with anonymized review, scoring, synthesis, and Fresh Eyes validation.
      orderedStages: [GENERATE, ANONYMIZE, REVIEW, SCORE, SYNTHESIZE, VALIDATE]
      stageOptions:
        SYNTHESIZE:
          preserve-dissent: true
    rigorous:
      description: High-rigor council with conditional debate, post-debate revision, re-review, second scoring, validation, and export.
      # Added REVISE (post-debate draft revision) and
      # REVIEW_POST_DEBATE (re-review incorporating debate arguments) stages.
      orderedStages: [GENERATE, ANONYMIZE, REVIEW, SCORE, DEBATE, REVISE, REVIEW_POST_DEBATE, SCORE, SYNTHESIZE, VALIDATE, EXPORT]
      stageOptions:
        DEBATE:
          min-rounds: 2
          max-rounds: 3
          # KS is only consulted for councils of 8+ members, where it is not
          # quantised into uselessness. Smaller councils stop when every member's
          # confidence moved less than convergence-confidence-delta points.
          ks-convergence-threshold: 0.10
          convergence-confidence-delta: 5.0
          # Reviewer disagreement about the SAME draft. Variance across different
          # drafts measures how decisively the council ranked them, which is high
          # exactly when they agree — the opposite of a reason to debate.
          debate-trigger-score-variance: 40.0
          # The normal preset does not manufacture disagreement. When reviewers
          # agree, debate and its dependent stages are explicitly skipped. A
          # derived user protocol can set this true for demonstrations or audits
          # that must exercise every stage regardless of the evidence.
          force-run: false
          # Capitulation needs BOTH: the reasoning stood still (Jaccard at or above
          # sycophancy-threshold, against the member's own previous turn or the
          # others' prior turns) AND confidence moved at least this many points
          # toward the majority. Both values are uncalibrated starting points —
          # they want setting from recorded debate transcripts, not from intuition.
          sycophancy-threshold: 0.70
          sycophancy-confidence-delta: 15.0
        SYNTHESIZE:
          preserve-dissent: true
        EXPORT:
          export-raw-artifacts: false
