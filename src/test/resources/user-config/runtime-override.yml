# Fixture for UserConfigRuntimeTest: exercises the runtime section on its own,
# with no models or policies, so the assertion isolates runtime application.
version: 1
runtime:
  maxConcurrentRuns: 3
  chatRecentTurnCount: 9
  # Only two of the three retention bounds, deliberately: the third proves an
  # unmentioned bound keeps its shipped value rather than being reset.
  retention:
    maxSessions: 25
    maxEventsPerSession: 750
